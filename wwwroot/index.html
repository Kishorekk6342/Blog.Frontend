<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Blog App</title>
    <base href="/" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
          rel="stylesheet" />

    <!-- MudBlazor CSS -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- App CSS -->
    <link href="Blog.Frontend.styles.css" rel="stylesheet" />

    <!-- Cropper.js CSS -->
    <link href="https://unpkg.com/cropperjs@1.6.1/dist/cropper.min.css"
          rel="stylesheet" />

    <!-- Startup Loader Styles -->
    <style>
        #startup-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            z-index: 9999;
            font-family: Roboto, sans-serif;
            color: #6366f1;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #e5e7eb;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- 🔵 Startup Loader -->
    <!-- ✅ REQUIRED ROOT ELEMENT -->
    <div id="app">
        <div id="startup-loader">
            <div class="spinner"></div>
            <div>Loading...</div>
        </div>
    </div>

    <!-- Blazor error UI -->
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Blazor WebAssembly -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- MudBlazor JS -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <!-- ✅ Cropper.js (MUST load before custom JS) -->
    <script src="https://unpkg.com/cropperjs@1.6.1/dist/cropper.min.js"></script>

    <!-- ✅ Custom Cropper Wrapper -->
    <script>
        window.imageCropper = {
            cropper: null,

            init: function (imgId) {
                const img = document.getElementById(imgId);

                if (!img) {
                    console.error("Cropper init failed. Image not found:", imgId);
                    return;
                }

                // Destroy existing instance
                if (this.cropper) {
                    this.cropper.destroy();
                    this.cropper = null;
                }

                this.cropper = new Cropper(img, {
                    aspectRatio: 1,
                    viewMode: 1,
                    autoCropArea: 1,
                    responsive: true,
                    dragMode: "move"
                });
            },

            crop: function (size) {
                if (!this.cropper) return null;

                return this.cropper
                    .getCroppedCanvas({
                        width: size,
                        height: size
                    })
                    .toDataURL("image/jpeg", 0.9);
            },

            destroy: function () {
                if (this.cropper) {
                    this.cropper.destroy();
                    this.cropper = null;
                }
            }
        };
    </script>
</body>
</html>
